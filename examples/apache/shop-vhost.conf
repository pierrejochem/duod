# /etc/apache2/sites-available/shop.conf
# Requires: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName shop.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/shop.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shop.example.com/privkey.pem

    # duod owns this file and rewrites it on every promotion / rollback.
    # IncludeOptional so Apache also starts before the first deployment.
    IncludeOptional /etc/apache2/duod/shop.conf

    ErrorLog  ${APACHE_LOG_DIR}/shop-error.log
    CustomLog ${APACHE_LOG_DIR}/shop-access.log combined
</VirtualHost>
